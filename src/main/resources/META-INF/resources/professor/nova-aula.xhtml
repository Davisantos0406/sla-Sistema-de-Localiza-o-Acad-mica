<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/template.xhtml">

    <ui:define name="conteudo">

        <style>
            .nova-aula-page {
                max-width: 980px;
                margin: 0 auto;
                padding: 12px 0 28px;
            }

            .nova-aula-card {
                background: #fff;
                border: 1px solid #e5ebf4;
                border-radius: 22px;
                box-shadow: 0 8px 30px rgba(17, 56, 103, 0.06);
                overflow: hidden;
            }

            .nova-aula-header {
                background: linear-gradient(120deg, #092e65, #0a78d5);
                color: #fff;
                padding: 28px 30px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
            }

            .nova-aula-header h1 {
                margin: 0;
                font-size: 28px;
                color: white;
            }

            .nova-aula-header p {
                margin: 6px 0 0;
                color: #d9ebff;
                font-size: 13px;
            }

            .nova-aula-body {
                padding: 28px 30px 30px;
            }

            .nova-aula-form {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 22px;
            }

            .nova-aula-field {
                display: flex;
                flex-direction: column;
                gap: 9px;
            }

            .nova-aula-field.full {
                grid-column: 1 / -1;
            }

            .nova-aula-field label {
                font-size: 12px;
                font-weight: 700;
                color: #294567;
                letter-spacing: .02em;
            }

            .nova-aula-field .ui-selectonemenu,
            .nova-aula-field .ui-inputtext,
            .nova-aula-field .ui-inputtextarea {
                width: 100% !important;
            }

            .nova-aula-actions {
                display: flex;
                justify-content: flex-end;
                gap: 12px;
                margin-top: 26px;
            }

            .nova-aula-note {
                margin-top: 22px;
                padding: 16px 18px;
                background: #edf6ff;
                border: 1px solid #dcecff;
                border-radius: 12px;
                color: #3d5d80;
                font-size: 12px;
                line-height: 1.6;
            }

            @media (max-width: 760px) {
                .nova-aula-form {
                    grid-template-columns: 1fr;
                }

                .nova-aula-header {
                    flex-direction: column;
                    align-items: flex-start;
                }
            }
        </style>

        <main class="nova-aula-page">

            <section class="nova-aula-card">

                <div class="nova-aula-header">
                    <div>
                        <h1>Adicionar nova aula</h1>
                        <p>Cadastre uma nova alocação com disciplina, ambiente e horário.</p>
                    </div>

                    <p:button outcome="/professor/painel.xhtml"
                              value="Voltar ao painel"
                              icon="pi pi-arrow-left"
                              styleClass="ui-button-secondary"/>
                </div>

                <div class="nova-aula-body">
                    <h:form id="novaAulaForm" styleClass="nova-aula-form-wrapper">
                        <p:messages showDetail="true" closable="true"/>

                        <div class="nova-aula-form">

                            <div class="nova-aula-field">
                                <p:outputLabel for="disciplina" value="Disciplina"/>
                                <p:selectOneMenu id="disciplina"
                                                 value="#{professorAulaBean.novaAula.disciplinaId}"
                                                 required="true"
                                                 requiredMessage="Selecione uma disciplina.">
                                    <f:selectItem itemLabel="Selecione a disciplina" itemValue="" noSelectionOption="true"/>
                                    <f:selectItems value="#{professorAulaBean.disciplinas}"
                                                   var="disciplina"
                                                   itemLabel="#{disciplina.nome} (#{disciplina.codigo})"
                                                   itemValue="#{disciplina.id}"/>
                                </p:selectOneMenu>
                            </div>

                            <div class="nova-aula-field">
                                <p:outputLabel for="localizacao" value="Localização"/>
                                <p:selectOneMenu id="localizacao"
                                                 value="#{professorAulaBean.novaAula.salaId}"
                                                 required="true"
                                                 requiredMessage="Selecione a localização.">
                                    <f:selectItem itemLabel="Selecione a sala" itemValue="" noSelectionOption="true"/>
                                    <f:selectItems value="#{professorAulaBean.salas}"
                                                   var="sala"
                                                   itemLabel="#{sala.bloco} - #{sala.numero} (#{sala.tipo})"
                                                   itemValue="#{sala.id}"/>
                                </p:selectOneMenu>
                            </div>

                            <div class="nova-aula-field">
                                <p:outputLabel for="diaSemana" value="Dia da semana"/>
                                <p:selectOneMenu id="diaSemana"
                                                 value="#{professorAulaBean.novaAula.diaSemana}"
                                                 required="true"
                                                 requiredMessage="Informe o dia da semana.">
                                    <f:selectItem itemLabel="Selecione o dia" itemValue="" noSelectionOption="true"/>
                                    <f:selectItem itemLabel="Segunda-feira" itemValue="Segunda-feira"/>
                                    <f:selectItem itemLabel="Terça-feira" itemValue="Terça-feira"/>
                                    <f:selectItem itemLabel="Quarta-feira" itemValue="Quarta-feira"/>
                                    <f:selectItem itemLabel="Quinta-feira" itemValue="Quinta-feira"/>
                                    <f:selectItem itemLabel="Sexta-feira" itemValue="Sexta-feira"/>
                                    <f:selectItem itemLabel="Sábado" itemValue="Sábado"/>
                                </p:selectOneMenu>
                            </div>

                            <div class="nova-aula-field">
                                <p:outputLabel for="horarioInicio" value="Horário de início"/>
                                <p:inputText id="horarioInicio"
                                             value="#{professorAulaBean.novaAula.horarioInicio}"
                                             placeholder="Ex.: 19:00"
                                             required="true"
                                             requiredMessage="Informe o horário de início."/>
                            </div>

                            <div class="nova-aula-field">
                                <p:outputLabel for="horarioFim" value="Horário de término"/>
                                <p:inputText id="horarioFim"
                                             value="#{professorAulaBean.novaAula.horarioFim}"
                                             placeholder="Ex.: 20:40"
                                             required="true"
                                             requiredMessage="Informe o horário de término."/>
                            </div>

                        </div>

                        <div class="nova-aula-actions">
                            <p:button outcome="/professor/painel.xhtml"
                                     value="Cancelar"
                                     styleClass="ui-button-secondary"/>
                            <p:commandButton value="Salvar aula"
                                             action="#{professorAulaBean.salvarAula}"
                                             ajax="false"
                                             icon="pi pi-check"/>
                        </div>

                        <div class="nova-aula-note">
                            Os campos acima correspondem às principais informações da aula: disciplina, ambiente, dia e horário.
                            A nova alocação ficará disponível imediatamente no painel do professor.
                        </div>

                    </h:form>
                </div>

            </section>

        </main>

    </ui:define>

</ui:composition>

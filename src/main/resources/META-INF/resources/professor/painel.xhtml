<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Painel do Professor - SLA</title>
</h:head>

<h:body style="padding: 20px; background-color: #f4f7f6;">
    <h:form>
        <h1>Painel do Professor: #{loginBean.usuarioLogado.nome}</h1>
        
        <p:panel header="Minhas Turmas Alocadas" style="margin-top: 20px;">
            <p:dataTable value="#{loginBean.alocacoes}" var="a">
                <p:column headerText="Disciplina">
                    <h:outputText value="#{a.DISCIPLINA}" />
                </p:column>
                <p:column headerText="Bloco / Sala">
                    <h:outputText value="#{a.BLOCO} - Sala #{a.NUMERO}" />
                </p:column>
                <p:column headerText="Horário">
                    <h:outputText value="#{a.HORARIO}" />
                </p:column>
            </p:dataTable>
        </p:panel>
        
        <p:commandButton value="Sair" action="/login.xhtml?faces-redirect=true" style="margin-top: 20px;" />
    </h:form>
</h:body>
</html>

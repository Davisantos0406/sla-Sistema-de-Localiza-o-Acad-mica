<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>SLA - Login</title>
</h:head>

<h:body style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f7f6;">

    <p:card style="width: 25rem; padding: 1rem;">
        <f:facet name="title">
            Sistema de Localização Acadêmica (SLA)
        </f:facet>

        <h:form>
    <p:messages id="msgs" showDetail="true" closable="true"/>

    <h:panelGrid columns="2" cellpadding="5" style="width: 100%;">
        <p:outputLabel for="email" value="E-mail:" />
        <p:inputText id="email" value="#{loginBean.email}" required="true" style="width: 100%;" />

        <p:outputLabel for="senha" value="Senha:" />
        <p:password id="senha" value="#{loginBean.senha}" required="true" style="width: 100%;" />
    </h:panelGrid>

    <p:commandButton value="Entrar"
                     action="#{loginBean.fazerLogin}"
                     update="msgs"
                     style="width: 100%; margin-top: 10px;" />
</h:form>
    </p:card>

</h:body>
</html>
